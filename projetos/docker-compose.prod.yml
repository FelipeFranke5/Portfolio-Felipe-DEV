# ============================================================
#  docker-compose.prod.yml - PRODUÇÃO
#
#  Diferenças em relação ao docker-compose.yml (dev):
#    - Front-end: build de produção do Angular, servido como
#      estático pelo próprio NGINX (sem container "frontend"
#      separado com ng serve) — ver website-frontend/Dockerfile.prod
#      e nginx/nginx.prod.conf.
#    - Keycloak em modo produção (não "start-dev").
#    - Postgres, Keycloak e back-end não publicam porta no host:
#      só o NGINX fica exposto (80/443). Tudo mais é interno à
#      rede Docker.
#    - Health checks robustos em todos os serviços, usados via
#      "condition: service_healthy" para evitar boot em cascata
#      com dependências ainda não prontas.
#    - Backup automatizado do Postgres (serviço postgres_backup),
#      endereçando o ponto pendente #9 do README.
#    - Renovação automática do certificado TLS (serviço certbot,
#      método webroot, roda "certbot renew" a cada 12h). O NGINX
#      recarrega a cada 6h (ver website-frontend/nginx-entrypoint.sh)
#      para pegar o certificado renovado sem downtime.
#    - Limites de memória/CPU pensados para uma VPS 4GB/2vCPU
#
#  Pré-requisitos antes do primeiro "docker compose -f
#  docker-compose.prod.yml up -d --build":
#    1. .env com todas as variáveis obrigatórias (ver README,
#       seção "Variáveis de Ambiente", + as novas abaixo).
#    2. nginx/nginx.prod.conf com "SEU_DOMINIO" substituído pelo
#       domínio real (arquivo estático, não é gerado dinamicamente).
#    3. EMISSÃO INICIAL DO CERTIFICADO (só na primeira vez — o
#       serviço certbot deste compose só RENOVA certificados que já
#       existem, não emite o primeiro). Com a porta 80 livre no host
#       (nada do stack rodando ainda) e o DNS do domínio já apontando
#       para a VPS:
#
#         docker run --rm -p 80:80 \
#           -v /etc/letsencrypt:/etc/letsencrypt \
#           certbot/certbot certonly --standalone \
#           -d SEU_DOMINIO --email SEU_EMAIL --agree-tos --no-eff-email
#
#       Isso cria /etc/letsencrypt/live/SEU_DOMINIO/ no host. Só
#       depois disso o "docker compose up" abaixo funciona (o NGINX
#       não sobe sem o certificado já existir).
#
#  Uso (depois do passo 3 acima):
#    docker compose -f docker-compose.prod.yml up -d --build
# ============================================================

services:

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: website_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME:-website_db}
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASS:?defina DB_PASS no .env}
    expose:
      - "5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-website_user} -d ${DB_NAME:-website_db}"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - website_prod_net

  postgres_backup:
    build:
      context: ./postgres-backup
      dockerfile: Dockerfile
    container_name: website_db_backup_prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-website_db}
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASS:?defina DB_PASS no .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - website_prod_net

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1-0@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
    container_name: website_keycloak_prod
    command: 
      - start
      - --import-realm
    volumes:
      - ./keycloak/prod:/opt/keycloak/data/import
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?defina KC_BOOTSTRAP_ADMIN_USERNAME no .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?defina KC_BOOTSTRAP_ADMIN_PASSWORD no .env}
      KC_HTTP_RELATIVE_PATH: /auth

      # NGINX termina TLS e repassa para o Keycloak em HTTP puro
      # dentro da rede interna do Docker.
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: frankefelipe-dev.tech
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded

      # Necessário para o health check abaixo (endpoint de management,
      # porta 9000, não exposta ao host).
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_CONNECT_TIMEOUT: 20s
      KC_DB_USERNAME: ${DB_USER:?defina DB_USER no .env}
      KC_DB_PASSWORD: ${DB_PASS:?defina DB_PASS no .env}
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-website_db}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /auth/health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -m 1 status | grep -m 1 -q UP
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 768m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - website_prod_net

  backend:
    build:
      context: ./website-backend/website-backend
      dockerfile: Dockerfile
    container_name: website_api_prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"

      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-website_db}
      DB_USER: ${DB_USER:?defina DB_USER no .env}
      DB_PASS: ${DB_PASS:?defina DB_PASS no .env}

      KEYCLOAK_JWKS_URI: http://keycloak:8080/auth/realms/website/protocol/openid-connect/certs

      FRONT_END_URL: ${FRONT_END_URL:?defina FRONT_END_URL no .env}

      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:?defina MAIL_USER no .env}
      MAIL_PASS: ${MAIL_PASS:?defina MAIL_PASS no .env}

      SPRING_AI_ANTHROPIC_API_KEY: ${SPRING_AI_ANTHROPIC_API_KEY:?defina SPRING_AI_ANTHROPIC_API_KEY no .env}
      CHATBOT_MODEL:              ${CHATBOT_MODEL:-claude-haiku-4-5}
      CHATBOT_MAX_TOKENS:         ${CHATBOT_MAX_TOKENS:-600}
      CHATBOT_MAX_PER_MINUTE:     ${CHATBOT_MAX_PER_MINUTE:-5}
      CHATBOT_MAX_PER_USER_DAILY: ${CHATBOT_MAX_PER_USER_DAILY:-40}
      CHATBOT_MAX_CONCURRENT:     ${CHATBOT_MAX_CONCURRENT:-2}
    expose:
      - "8085"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 768m
    cpus: "0.75"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - website_prod_net

  nginx:
    build:
      context: ./website-frontend
      dockerfile: Dockerfile.prod
    container_name: website_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - website_prod_net

  certbot:
    image: certbot/certbot:v5.7.0@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    container_name: website_certbot_prod
    # certbot renew só age em certificados já emitidos (ver bootstrap
    # no cabeçalho deste arquivo) e só os substitui de fato quando
    # estão perto de expirar — rodar a cada 12h é seguro e é o
    # intervalo recomendado pela própria documentação do Certbot.
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $$!;
      done;'
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - website_prod_net

volumes:
  postgres_data_prod:
  postgres_backups:
  certbot_webroot:

networks:
  website_prod_net:
    driver: bridge
