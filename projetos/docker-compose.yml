# ============================================================
#  docker-compose.yml - DEV
#
#  Sobe: back-end (Spring Boot), front-end (Angular via ng serve),
#  PostgreSQL, NGINX (proxy de dev) e Keycloak (modo dev, com
#  admin/admin padrão).
#
#  Uso:
#    docker compose up -d --build
#
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: website_db_dev
    environment:
      POSTGRES_DB: website_db
      POSTGRES_USER: website_user
      POSTGRES_PASSWORD: website_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U website_user -d website_db"]
      start_period: 60s
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - website_dev_net

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: website_keycloak_dev
    command: start-dev
    environment:
      # KEYCLOAK_ADMIN e KEYCLOAK_ADMIN_PASSWORD foram deprecados
      # Novo uso deve ser: KC_BOOTSTRAP_ADMIN_USERNAME e KC_BOOTSTRAP_ADMIN_PASSWORD
      # Doc https://www.keycloak.org/server/all-config
      #KEYCLOAK_ADMIN: admin
      #KEYCLOAK_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      # Habilita /auth/health/ready, usado no healthcheck abaixo
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_CONNECT_TIMEOUT: 20s
      KC_DB_USERNAME: website_user
      KC_DB_PASSWORD: website_pass
      KC_DB_URL: jdbc:postgresql://postgres:5432/website_db
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/auth/health/ready || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - website_dev_net

  backend:
    build:
      context: ./website-backend/website-backend
      dockerfile: Dockerfile
    container_name: website_api_dev
    environment:
      SPRING_PROFILES_ACTIVE: dev

      # Banco de dados
      DB_URL: jdbc:postgresql://postgres:5432/website_db
      DB_USER: website_user
      DB_PASS: website_pass

      # Keycloak (comunicação server-to-server, direto no container)
      # IMPORTANTE: dentro da rede Docker usamos a porta INTERNA do container (8080),
      # não a porta 8083 publicada no host. "8083:8080" no serviço keycloak só vale
      # para acesso de fora do Docker.
      KEYCLOAK_JWKS_URI: http://keycloak:8080/auth/realms/website/protocol/openid-connect/certs

      # CORS - origem do Angular, servido através do NGINX de dev (porta 80)
      FRONT_END_URL: http://localhost

      # SMTP fake para dev
      # Não impede o resto de funcionar.
      MAIL_HOST: localhost
      MAIL_PORT: "1025"
      MAIL_USER: dev@localhost
      MAIL_PASS: dev

      # Chatbot (Spring AI / Anthropic)
      # A sintaxe ${VAR:?msg} faz o `docker compose up` FALHAR se a chave não estiver
      # no .env — melhor do que subir "funcionando" e só quebrar na primeira pergunta.
      SPRING_AI_ANTHROPIC_API_KEY: ${SPRING_AI_ANTHROPIC_API_KEY:?defina SPRING_AI_ANTHROPIC_API_KEY no .env}
      CHATBOT_MODEL:               ${CHATBOT_MODEL:-claude-haiku-4-5}
      CHATBOT_MAX_TOKENS:          ${CHATBOT_MAX_TOKENS:-600}
      CHATBOT_MAX_PER_MINUTE:      ${CHATBOT_MAX_PER_MINUTE:-5}
      CHATBOT_MAX_PER_USER_DAILY:  ${CHATBOT_MAX_PER_USER_DAILY:-40}
      CHATBOT_MAX_CONCURRENT:      ${CHATBOT_MAX_CONCURRENT:-2}
    expose:
      - "8085"
    # Podemos depender só do keycloak aqui e o keycloak depender do banco
    depends_on:
    #  postgres:
    #    condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped
    networks:
      - website_dev_net

  frontend:
    build:
      context: ./website-frontend
      dockerfile: Dockerfile
    container_name: website_frontend_dev
    expose:
      - "4200"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - website_dev_net

  nginx:
    image: nginx:alpine
    container_name: website_nginx_dev
    ports:
      - "80:80"     # HTTP: front-end (/) + API (/api/) + Keycloak (/auth/)
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - keycloak
      - frontend
    restart: unless-stopped
    networks:
      - website_dev_net

volumes:
  postgres_data_dev:

networks:
  website_dev_net:
    driver: bridge
