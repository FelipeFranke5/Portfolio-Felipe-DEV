# ============================================================
#  nginx/nginx.prod.conf
#  NGINX de produção: serve o build estático do Angular, termina
#  TLS e faz proxy para o back-end (Spring Boot) e o Keycloak.
#
#  Pré-requisito: certificado TLS já emitido e presente no host em
#  /etc/letsencrypt/live/SEU_DOMINIO/ (fullchain.pem + privkey.pem),
#  montado como volume read-only no serviço nginx do
#  docker-compose.prod.yml. A emissão inicial é manual (ver bootstrap
#  no cabeçalho do docker-compose.prod.yml); a renovação depois disso
#  é automática, feita pelo serviço certbot do mesmo compose.
#
#  IMPORTANTE: NGINX não faz substituição de variáveis de ambiente em
#  arquivos de config montados diretamente. Substitua todas as
#  ocorrências de "SEU_DOMINIO" abaixo pelo domínio real antes do
#  primeiro deploy (find/replace único, este arquivo não é gerado
#  dinamicamente).
# ============================================================

# rate limit para leitura pública (GET /api/projects, /api/skills,
# handshake do chatbot, health check) — generoso, cobre navegação normal.
limit_req_zone $binary_remote_addr zone=api_read:10m rate=5r/s;

# rate limit dedicado ao único endpoint de escrita público e não
# autenticado (POST /api/contact) — bem mais restrito, já que é o
# principal vetor de abuso/spam sem exigir login.
limit_req_zone $binary_remote_addr zone=api_write:10m rate=1r/s;

# rate limit para o Keycloak (/auth/) — protege o fluxo de login
# contra força bruta sem atrapalhar o uso normal.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name SEU_DOMINIO;

    # Permite renovação de certificado via webroot (Certbot), se usado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name SEU_DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Endpoint de escrita público — rate limit restrito.
    location = /api/contact {
        limit_req zone=api_write burst=5 nodelay;

        proxy_pass         http://backend:8085;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Demais rotas da API (leitura pública + admin + WebSocket do chatbot).
    # O chatbot tem sua própria cota de uso (ChatbotRateLimiter, na aplicação),
    # então o rate limit aqui é o mesmo da leitura pública.
    location /api/ {
        limit_req zone=api_read burst=20 nodelay;

        proxy_pass         http://backend:8085;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location /actuator/ {
        limit_req zone=api_read burst=20 nodelay;

        proxy_pass         http://backend:8085;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Keycloak. KC_HTTP_RELATIVE_PATH=/auth no serviço keycloak, então
    # repassar a URI original (/auth/...) sem reescrita bate certinho
    # com o contexto configurado no Keycloak.
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass         http://keycloak:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Front-end (Angular) — arquivos estáticos, copiados na imagem
    # pelo Dockerfile.prod. try_files garante que rotas do Angular
    # Router (client-side) caiam em index.html em vez de 404.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (JS/CSS gerados pelo build) podem ter
    # cache longo e imutável; index.html nunca é cacheado, para que
    # deploys novos sejam sempre pegos pelo navegador.
    location ~* \.(?:js|css|woff2?|ttf|svg|ico|png|jpg|jpeg|gif)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
