# ═══════════════════════════════════════════════════════
#  Configuração dos testes
#
#  ATENÇÃO: este arquivo SOMBREIA por completo o src/main/resources/application.yml
#  (test-classes vem antes de classes no classpath). Nada definido lá vale aqui —
#  é por isso que os testes precisam mockar o JwtDecoder, por exemplo.
# ═══════════════════════════════════════════════════════

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true # Mostra o SQL nos testes
    properties:
        format_sql: true
        default_batch_fetch_size: 100
