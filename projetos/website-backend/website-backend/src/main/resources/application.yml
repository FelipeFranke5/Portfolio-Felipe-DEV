# ═══════════════════════════════════════════════════════
#  Configurações base (todos os perfis)
# ═══════════════════════════════════════════════════════

# ─── Spring AI (chatbot) ────────────────────────────
spring:
  ai:
    anthropic:
      api-key: ${SPRING_AI_ANTHROPIC_API_KEY:chave-nao-configurada}
      # Sem isto o timeout fica a critério do default do SDK da Anthropic — uma chamada
      # travada seguraria uma thread do pool (CHATBOT_MAX_SIMULTANEAS) indefinidamente.
      timeout: ${CHATBOT_TIMEOUT:30s}
      chat:
        # ATENÇÃO: no Spring AI 2.0 o prefixo é spring.ai.anthropic.chat.*
        # O aninhado spring.ai.anthropic.chat.options.* está @Deprecated(forRemoval).
        #
        # A IA é paga por token: o modelo e o teto de resposta ficam fixos aqui (e
        # sobrescritíveis por variável de ambiente) para o custo por pergunta não
        # depender do default do starter, que pode mudar de versão para versão.
        model:       ${CHATBOT_MODEL:claude-haiku-4-5}
        max-tokens:  ${CHATBOT_MAX_TOKENS:600}
        temperature: 0.2

  # ─── Serializacao ─────────────────────────────────
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  application:
    name: website-backend

  # ─── Banco de Dados ─────────────────────────────────
  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/website_db}
    username: ${DB_USER:website_user}
    password: ${DB_PASS:website_pass}
    driver-class-name: org.postgresql.Driver

  # ─── JPA / Hibernate ────────────────────────────────
  jpa:
    hibernate:
      # validate: Flyway cria/atualiza o schema; Hibernate apenas valida
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 100

  # ─── Flyway ─────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Inicialização automatizada com baseline-on-migrate = true
    # Risco baixo
    baseline-on-migrate: true
    baseline-version: 1

  # ─── OAuth2 Resource Server (Keycloak) ──────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          # URI do JWKS do Keycloak - Spring busca a chave pública aqui
          # e valida o JWT localmente (sem chamada remota em cada request)
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/website/protocol/openid-connect/certs}

  # ─── E-mail (SMTP) ──────────────────────────────────
  mail:
    host:     ${MAIL_HOST:smtp.gmail.com}
    port:     ${MAIL_PORT:587}
    username: ${MAIL_USER:user}
    password: ${MAIL_PASS:pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# ─── Chatbot — cota de uso por usuário autenticado ────
# Cada pergunta vira ao menos uma chamada paga à Anthropic (o loop de tool calling
# costuma gerar mais de uma). Estes são os tetos de gasto.
chatbot:
  quota:
    maxPerMinute:            ${CHATBOT_MAX_PER_MINUTE:5}
    maxPerUserPerDay:        ${CHATBOT_MAX_PER_USER_DAILY:40}
    maxConcurrentCalls:      ${CHATBOT_MAX_CONCURRENT:2}

# ─── Servidor ─────────────────────────────────────────
server:
  port: 8085
  # Quando rodar atrás do NGINX, confiar nos headers de forward
  forward-headers-strategy: native

# ─── Actuator ─────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        # Expõe apenas health e info
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
